settings:
  - name: bot_id
    type: text-input
    required: true
    label:
      en_US: Bot ID
      zh_Hans: Bot ID
      ja_JP: Bot ID
  - name: secret
    type: secret-input
    required: true
    label:
      en_US: Secret
      zh_Hans: Secret
      ja_JP: Secret
  - name: app
    type: app-selector
    scope: chat
    required: true
    label:
      en_US: App
      zh_Hans: 应用
      ja_JP: アプリ
    placeholder:
      en_US: Select the app/agent that should answer WeCom messages
      zh_Hans: 选择用于回复企业微信消息的应用/代理
      ja_JP: WeCom メッセージに応答するアプリ/エージェント
